<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>GameVault Admin</h2>

            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">API</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="main">

            <header>
                <div>
                    <h1>Dashboard</h1>
                    <p>Welcome back, <span id="adminName">Admin</span>.</p>
                </div>

                <button id="logoutBtn">Logout</button>
            </header>

            <!-- Statistics -->
            <section class="stats">

                <div class="card">
                    <span>Total Users</span>
                    <strong id="totalUsers">-</strong>
                </div>

                <div class="card">
                    <span>Active Users</span>
                    <strong>-</strong>
                </div>

                <div class="card">
                    <span>API Requests</span>
                    <strong>-</strong>
                </div>

                <div class="card">
                    <span>Database</span>
                    <strong class="connected">Connected</strong>
                </div>

                <div class="card">
                    <span>Store listings</span>
                    <strong id="totalProducts">-</strong>
                </div>

            </section>

            <section class="panel product-panel">
                <div class="panel-header">
                    <div>
                        <h2>Game account listings</h2>
                        <p>Restock, pause, add, or remove items from the storefront.</p>
                    </div>
                    <button id="refreshProductsBtn" type="button">Refresh</button>
                </div>
                <form id="productForm" class="product-form">
                    <input name="name" placeholder="Game / listing name" required>
                    <input name="category" placeholder="Category" required>
                    <input name="price" type="number" min="0" step="0.01" placeholder="Price" required>
                    <input name="badge" placeholder="Badge, e.g. Level 80">
                    <input name="description" placeholder="Short description">
                    <select name="mode"><option value="restock">Restock</option><option value="out-of-stock">Out of stock</option></select>
                    <button type="submit">Add listing</button>
                </form>
                <div class="admin-product-grid" id="productTable"></div>
            </section>

            <!-- Recent Users -->
            <section class="panel">

                <div class="panel-header">
                    <h2>Recent Users</h2>
                    <button id="refreshBtn">Refresh</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Created At</th>
                            <th>Status</th>
                            <th>Delete</th>
                        </tr>
                    </thead>

                    <tbody id="userTable">

                    </tbody>
                </table>

            </section>

        </main>

    </div>

    <script src="js/index.js"></script>

</body>

</html>
