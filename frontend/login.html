<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in | GameVault</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <p class="login-kicker">MEMBER ACCESS</p>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label for="username">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username or email"
                        required
                    >

                </div>

                <div class="form-group" id="otpGroup" hidden>
                    <label for="otp">Email verification code</label>
                    <input type="text" id="otp" inputmode="numeric" pattern="\d{6}" maxlength="6">
                    <p class="otp-help">We sent a six-digit code to your email.</p>
                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" id="loginBtn">
                    Login
                </button>


                <div class="message" id="message" role="status" aria-live="polite"></div>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
